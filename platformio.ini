; ---------------------------------------------------------------------
; 🏍️ PHYSICAL MOTORCYCLE HARDWARE TARGET (WAVESHARE PANEL)
; ---------------------------------------------------------------------
[env:waveshare_esp32s3_43b]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1

; RENAME THIS LINE TO build_src_filter
build_src_filter = +<*> -<simulator_main.cpp>

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1


; ---------------------------------------------------------------------
; 💻 NATIVE WINDOWS EMULATOR TARGET (PC SIMULATOR WINDOW)
; ---------------------------------------------------------------------
[env:emulator_windows]
platform = native

; RENAME THIS LINE TO build_src_filter
build_src_filter = +<*> -<main.cpp>

build_flags =
    -D PC_SIMULATOR=1
    -D TFT_WIDTH=800
    -D TFT_HEIGHT=480
    
    -DLV_CONF_INCLUDE_SIMPLE
    -I"include"
    -I".pio/libdeps/emulator_windows/lvgl/src"
    -I".pio/libdeps/emulator_windows/lvgl"
    
    -lSDL2
    -I"F:/msys64/ucrt64/include/SDL2"
    -L"F:/msys64/ucrt64/lib"
    
lib_deps =
    lvgl/lvgl@^9.2.2

