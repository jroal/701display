[env:waveshare_esp32s3_43b]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1     ; Base development board definition for the S3 chip
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@^9.2.2                       ; Professional UI engine for rendering digital gauges

; ADD THIS LINE TO IGNORE THE DESKTOP SIMULATOR ON REAL HARDWARE:
src_filter = +<*> -<simulator_main.cpp>

; --- FORCE PLATFORMIO TO USE YOUR F-DRIVE COMPILER TOOLCHAIN ---
platform_packages =
    toolchain-atmelavr @ file://F:/msys64/ucrt64

; --- Hardware Optimization Flags ---
build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; Enable and configure the 8MB external PSRAM (OPI configuration)
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Make the project include folder visible to LVGL's config header lookup
    -I include
    -D LV_CONF_PATH=\"lv_conf.h\"
    ; Define the specific display characteristics for driver compilation
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D TFT_WIDTH=800
    -D TFT_HEIGHT=480

; --- Flash and PSRAM Partition Settings ---
board_build.arduino.memory_type = qio_opi ; Match the flash (QIO) and PSRAM (OPI) speed layout
board_build.flash_mode = qio
board_build.f_flash = 80000000L           ; Set Flash to high-speed 80MHz
board_build.f_cpu = 240000000L            ; Max out the LX7 dual-core clock speed to 240MHz
board_upload.flash_size = 16MB             ; Allocates code storage space for the full 16MB chip

; --- 💻 WINDOWS EMULATOR TARGET BLOCK ---
[env:emulator_windows]
platform = native
extra_scripts = 
build_flags =
    -D PC_SIMULATOR=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D TFT_WIDTH=800
    -D TFT_HEIGHT=480
; --- FORCE LVGL TO FIND YOUR LOCAL INCLUDE DIRECTORY ---
    -DLV_CONF_INCLUDE_SIMPLE
    -I"include"
    -I".pio/libdeps/emulator_windows/lvgl/src"
    -I".pio/libdeps/emulator_windows/lvgl"
    
    ; Ensure your desktop header mappings lock onto the F: drive partition
    -lSDL2
    -I"F:/msys64/ucrt64/include/SDL2"
    -L"F:/msys64/ucrt64/lib"
    
lib_deps =
    lvgl/lvgl@^9.2.2

; ADD THIS LINE TO ENSURE NATIVE HARDWARE FILES DON'T ACCIDENTALLY LOAD HERE:
src_filter = +<*> -<main.cpp>

; Note: Waveshare's screen requires specific local library folders
; for its custom RGB display pipeline and I2C touch controller.
