[env:esp32s3-display]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1 ; (or your specific integrated board target)
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM       ; Unlocks extra memory for smooth gauge animations
    
lib_deps =
    lvgl/lvgl@^9.0.0         ; The professional graphics library
    ; Your chosen CAN/OBD-II protocol libraries will be declared here
