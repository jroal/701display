; ---------------------------------------------------------------------
; 🏍️ PHYSICAL MOTORCYCLE HARDWARE TARGET (WAVESHARE PANEL)
; ---------------------------------------------------------------------
[env:waveshare_esp32s3_43b]
platform = espressif32 @ 6.13.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi
monitor_speed = 115200

; RENAME THIS LINE TO build_src_filter
build_src_filter = +<*> -<simulator_main.cpp>

; Plain esptool upload over the board's native USB-CDC serial interface (MI_00, COM5).
; JTAG debugging still available separately via the MI_02 interface + esp-builtin.
upload_protocol = esptool
; upload_port = COM*
upload_speed = 921600
; monitor_port = COM*

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DESP_PANEL_CONF_PATH=ESP_Panel_Conf.h
    -Wno-narrowing

lib_deps =
    lvgl/lvgl@^9.2.2
    ESP32_Display_Panel@^1.1.1
    ESP32_IO_Expander@^1.1.0

[env:waveshare_esp32s3_43b_nosd]
extends = env:waveshare_esp32s3_43b
build_flags =
    ${env:waveshare_esp32s3_43b.build_flags}
    -D DISABLE_SD_LOGGING

[env:waveshare_esp32s3_rs485_can]
extends = env:waveshare_esp32s3_43b
; Let PlatformIO detect this board's serial port instead of inheriting the display board's COM5.
upload_port =
monitor_port =
build_flags =
    ${env:waveshare_esp32s3_43b.build_flags}
    -D HEADLESS_BUILD=1
    -D DISABLE_SD_LOGGING


; ---------------------------------------------------------------------
; 💻 NATIVE WINDOWS EMULATOR TARGET (PC SIMULATOR WINDOW)
; ---------------------------------------------------------------------
[env:emulator_windows]
platform = native

; RENAME THIS LINE TO build_src_filter
build_src_filter = +<*> -<main.cpp>

build_flags =
    -D PC_SIMULATOR=1
    -D TFT_WIDTH=800
    -D TFT_HEIGHT=480
    
    -DLV_CONF_INCLUDE_SIMPLE
    -I"include"
    -I".pio/libdeps/emulator_windows/lvgl/src"
    -I".pio/libdeps/emulator_windows/lvgl"
    
    -lSDL2
    -I"F:/msys64/ucrt64/include/SDL2"
    -L"F:/msys64/ucrt64/lib"
    
lib_deps =
    lvgl/lvgl@^9.2.2
