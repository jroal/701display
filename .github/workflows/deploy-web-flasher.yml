name: Build & Deploy ESP Web Flasher

on:
  release:
    types: [published] # Triggers whenever you create a new GitHub Release
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO & esptool
        run: |
          pip install platformio esptool

      - name: Build Firmware
        run: |
          pio run -e waveshare_esp32s3_43b

      - name: Merge Binaries
        run: |
          # Merge bootloader, partitions, and main app binary into one flash file starting at 0x0
          esptool.py --chip esp32s3 merge_bin -o firmware_merged.bin 0x0000 .pio/build/waveshare_esp32s3_43b/bootloader.bin 0x8000 .pio/build/waveshare_esp32s3_43b/partitions.bin 0x10000 .pio/build/waveshare_esp32s3_43b/firmware.bin

      - name: Generate manifest.json dynamically
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          cat <<EOF > manifest.json
          {
            "name": "Husky Display Firmware",
            "version": "${VERSION#v}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "firmware_merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      - name: Upload Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Deploys index.html, manifest.json, and firmware_merged.bin

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4