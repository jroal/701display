name: Build & Deploy ESP Web Flasher

on:
  release:
    types: [published] # Triggers whenever you create a new GitHub Release
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO & esptool
        run: |
          pip install platformio esptool

      - name: Build Firmware
        run: |
          pio run \
            -e waveshare_esp32s3_43b \
            -e waveshare_esp32s3_rs485_can

      - name: Merge Firmware Images
        run: |
          mkdir -p web-flasher
          for env in waveshare_esp32s3_43b waveshare_esp32s3_rs485_can; do
            esptool.py --chip esp32s3 merge_bin \
              -o "web-flasher/${env}_merged_${BUILD_ID}.bin" \
              0x0000 ".pio/build/${env}/bootloader.bin" \
              0x8000 ".pio/build/${env}/partitions.bin" \
              0x10000 ".pio/build/${env}/firmware.bin"
          done
          sed "s/\(manifest-[a-z]*\.json\)/\1?v=${BUILD_ID}/g" installer.html > web-flasher/installer.html
          cp web-flasher/installer.html web-flasher/index.html

      - name: Generate firmware manifests
        env:
          FIRMWARE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build_id = os.environ["BUILD_ID"]
          version = f'{os.environ["FIRMWARE_VERSION"].removeprefix("v")}+{build_id}'
          variants = {
              "display": ("Husky Display Firmware", "waveshare_esp32s3_43b"),
              "headless": ("Husky Headless Firmware", "waveshare_esp32s3_rs485_can"),
          }
          for variant, (name, environment) in variants.items():
              manifest = {
                  "name": name,
                  "version": version,
                  "builds": [{
                      "chipFamily": "ESP32-S3",
                      "parts": [{
                          "path": f"{environment}_merged_{build_id}.bin",
                          "offset": 0,
                      }],
                  }],
              }
              (Path("web-flasher") / f"manifest-{variant}.json").write_text(
                  json.dumps(manifest, indent=2) + "\n"
              )
          PY

      - name: Upload Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
